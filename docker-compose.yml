services:
  postgres:
    image: postgres:17
    container_name: medispheres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medispheres
      POSTGRES_USER: medispheres_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MEDISPHERE_APP_PASSWORD: ${MEDISPHERE_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
